envs:
    - name: AWSWRAPPER_DRIVER_VERSION
      description: "The version of the `software.amazon.jdbc:aws-advanced-jdbc-wrapper` Maven artifact. When set, this version is used instead of the default version bundled with the feature pack."
      required: false
      build-time: true
      alternate-system-property: "org.wildfly.datasources.awswrapper.driver.version"
